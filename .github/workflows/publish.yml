name: Publish
# Publishes to npm when a version tag (v1.2.3) is pushed, or when started by hand
# (Actions → Publish → Run workflow). npm tries trusted publishing (OIDC) first
# (npmjs.com → package Settings → Trusted Publisher → GitHub Actions, workflow
# "publish.yml") and falls back to the NPM_TOKEN repository secret if that fails.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - name: Tag matches package.json version
        if: github.event_name == 'push'
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Version is not published yet
        run: |
          v=$(node -p 'require("./package.json").version')
          if npm view "multi-agent-workbench@$v" version >/dev/null 2>&1; then echo "$v is already on npm"; exit 1; fi
      - run: npm run check
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          # Without this, setup-node leaves a placeholder token that breaks the publish.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
