name: Publish
# Publishes to npm when a version tag (v1.2.3) is pushed, using npm trusted publishing
# (OIDC): no token secret is needed. Configure the package on npmjs.com under
# Settings → Trusted Publisher → GitHub Actions with workflow filename "publish.yml".
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run check
      - run: npm test
      - run: npm publish --access public
